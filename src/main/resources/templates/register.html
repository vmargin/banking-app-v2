<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Create account | CASH-G</title><link rel="stylesheet" href="/css/app.css"></head>
<body class="auth-page">
<main class="auth-shell"><section class="auth-hero register-hero"><div class="logo"><span>C</span> CASH-G</div><p class="eyebrow">START WITH A CLEAR SIGNAL</p><h1>Build a steadier money habit.</h1><p class="muted">Set up a local account and keep every move easy to understand.</p><div class="signal"><i></i><span>Simple setup / clear records</span></div></section>
<section class="auth-card"><p class="eyebrow">GET STARTED</p><h2>Create your account.</h2><p class="muted">Three details. One local banking profile.</p><div class="alert error" th:if="${error}" th:text="${error}"></div><form method="post" action="/register" class="stack"><label>Full name<input name="fullName" type="text" placeholder="Enter your full name" required></label><label>Mobile number<input name="mobile" type="tel" inputmode="numeric" placeholder="09XXXXXXXXX" required></label><label>Create a four-digit PIN<input name="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" required></label><button class="primary" type="submit">Create account <span>↗</span></button></form><p class="switch">Already have an account? <a href="/login">Sign in</a></p></section></main>
</body></html>
